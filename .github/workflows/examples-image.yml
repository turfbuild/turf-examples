# Publishes the examples image: this repository at the root of an otherwise
# empty OCI image, versioned by a tag.
#
# The tag vX.Y.Z publishes
#   ghcr.io/turfbuild/turf-examples:X.Y.Z
# for linux/amd64 and linux/arm64. Mounted read-only (a Kubernetes image
# volume), every example sits at its own path, and Turf is given the path of
# the one to run. A configuration runs from the image when it commits its
# .terraform.lock.hcl and writes nothing beside itself at plan time (README,
# "Configuration images"). Tags are never moved; a change is a new version.
name: examples image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write # cosign's keyless signature: the workflow's identity, from GitHub's OIDC issuer

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the tag
        id: tag
        env:
          REF: ${{ github.ref_name }}
          OWNER: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${REF#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$REF: the version after v is not semver"; exit 1
          fi
          {
            echo "version=$version"
            echo "image=ghcr.io/${OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .github/configuration-image/Containerfile
          platforms: linux/amd64,linux/arm64
          # The index holds the two platform images and nothing else: an image
          # volume pulls by platform, and an attestation manifest would be a
          # third entry with no files in it.
          provenance: false
          push: true
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.title=turf-examples
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, keyless: the signature names this workflow and is
      # recorded in the public Rekor log. It is stored beside the image, not in
      # its index, so the index still holds the two platform images only.
      - name: Sign
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Summary
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          VERSION: ${{ steps.tag.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Examples image"
            echo
            echo "\`$IMAGE:$VERSION\`"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
