repositories:
  - name: cr-agentgateway-dev-charts
    url: cr.agentgateway.dev/charts
    oci: true
  - name: helm-ngc-nvidia-com-nvidia
    url: https://helm.ngc.nvidia.com/nvidia
  - name: prometheus-community-github-io-helm-charts
    url: https://prometheus-community.github.io/helm-charts
helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true
releases:
  - name: agentgateway
    namespace: agentgateway-system
    chart: cr-agentgateway-dev-charts/agentgateway
    version: v1.5.0
    values:
      - ./004-agentgateway/values.yaml
  - name: agentgateway-post
    namespace: agentgateway-system
    chart: ./005-agentgateway-post
    values:
      - ./005-agentgateway-post/values.yaml
    needs:
      - agentgateway
  - name: network-operator
    namespace: nvidia-network-operator
    chart: helm-ngc-nvidia-com-nvidia/network-operator
    version: 26.4.1
    values:
      - ./007-network-operator/values.yaml
  - name: kube-prometheus-stack
    namespace: monitoring
    chart: prometheus-community-github-io-helm-charts/kube-prometheus-stack
    version: 84.4.0
    values:
      - ./010-kube-prometheus-stack/values.yaml
