repositories:
  - name: helm-ngc-nvidia-com-nvidia
    url: https://helm.ngc.nvidia.com/nvidia
  - name: jmcgrath207-github-io-k8s-ephemeral-storage-metrics-chart
    url: https://jmcgrath207.github.io/k8s-ephemeral-storage-metrics/chart
  - name: prometheus-community-github-io-helm-charts
    url: https://prometheus-community.github.io/helm-charts
helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true
releases:
  - name: gpu-operator
    namespace: gpu-operator
    chart: helm-ngc-nvidia-com-nvidia/gpu-operator
    version: v26.7.0
    values:
      - ./011-gpu-operator/values.yaml
    disableValidation: true
  - name: k8s-ephemeral-storage-metrics
    namespace: monitoring
    chart: jmcgrath207-github-io-k8s-ephemeral-storage-metrics-chart/k8s-ephemeral-storage-metrics
    version: 1.19.2
    values:
      - ./012-k8s-ephemeral-storage-metrics/values.yaml
  - name: prometheus-adapter
    namespace: monitoring
    chart: prometheus-community-github-io-helm-charts/prometheus-adapter
    version: 5.3.0
    values:
      - ./016-prometheus-adapter/values.yaml
