# ansible_playbook_run runs ansible-playbook in this configuration's directory,
# so this file applies to every playbook the configuration runs.
[defaults]
collections_path = ./collections
# The hosts are new each run, and their addresses are recycled by AWS.
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3

[ssh_connection]
# Keep the hosts' keys out of ~/.ssh/known_hosts: the next run's host may get
# this run's address with a different key.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
