# turf.yaml — model configuration, co-branding, and the external-MCP overlay for
# this directory.
#
# turf merges two files, project overriding global:
#   ~/.turf/turf.yaml            (global — your personal defaults)
#   ./.turf/turf.yaml            (project — this file, versioned with the config)
#
# Precedence for the model actually used:
#   --model / TURF_MODEL  >  this file's `model:`  >  built-in default (auto)

model: default

models:
  default:
    # A candidate is either an inline provider/model OR the name of another
    # entry in this map — which is how `local` below keeps its provider_opts.
    first_available:
      - anthropic/claude-sonnet-5   # needs ANTHROPIC_API_KEY
      - google/gemini-pro-latest    # needs GOOGLE_API_KEY (or GEMINI_API_KEY)
      - local                       # Docker Model Runner — no key, no cost

  # Docker Model Runner (`docker model pull ai/qwen3`). context_size is required:
  # turf's prompt is ~27k tokens before you type anything, and the runner's
  # default window is far smaller, so an unconfigured local model rejects the
  # first message. Memory use scales with this number — lower it if it won't fit.
  local:
    provider: dmr
    model: ai/qwen3
    provider_opts:
      context_size: 65536

# Co-branding: give this directory a Scalr look and voice. Everything here is
# display or prompt surface — turf is not renamed (there is no `name` key; the
# binary, status bar, and agent badge still say turf), the tool namespace stays
# `turf_*`, and the approval gates are unchanged.
#
# `theme` names a theme ref, not a file: turf's own terrain themes work out of the
# box, and a distributor's own theme goes in ~/.turf/themes/<name>.yaml.
#
# `banner` is a path relative to THIS file. Plain text works — the lean TUI colors
# each line with the theme's accent — so ANSI art is optional.
branding:
  theme: surf
  banner: scalr-banner.txt
  welcome_message: |
    Welcome to Scalr — infrastructure management with governance built in.

    This session composes three tool namespaces: turf's local plan/apply engine,
    the Scalr API (variables, modules, policy groups), and OPA for policy
    evaluation. Scalr's policy checks normally fire only on Scalr-executed runs;
    here they run against a local plan, before anything is applied.

    What would you like to build?
  additional_instructions: |
    This session is Scalr-integrated. Read the `scalr` skill before the first Scalr
    or OPA call — it carries the call sequences for the scalr_* and opa_* tools. Load
    it and its reference files with the project-skill tools `read_skill` /
    `read_skill_file` (NOT `turf_read_skill_file` / `turf_skill_*`, which are
    turf-mcp-server's own built-in skills and don't know this project skill).

    This directory ships NO plot. On the first request, stand one up and bind its
    state to Scalr (state-storage-only REMOTE, the `turf-scalr-chat` workspace
    `../setup` created) — Turf still plans/applies locally:

    1. `turf_config_init` this directory (path = the config dir turf was launched with)
       to scaffold a fresh plot, with an `intent` like "Compose Scalr's registry
       variable and OPA policy in one local turf session; state lives in the Scalr
       workspace ../setup created."
    2. `turf_declare_backend` a `remote` backend — `organization` = `turf-demo`,
       `workspaces.name` = `turf-scalr-chat` (the `../setup` defaults), `hostname` =
       your Scalr account host: the host part of the exported `SCALR_API_URL`
       (`https://<acct>.scalr.io` → `<acct>.scalr.io`), or your `turf login` host. Do
       NOT open the `../setup` workspace to read its outputs — the identity is fixed,
       and opening it just locks and rewrites setup state.
    3. `turf_workspace_open` with the same `remote` backend args. The backend
       authenticates with a Scalr CLI token (`turf login <acct>.scalr.io` or
       `TF_TOKEN_<host>`), separate from the SCALR_API_TOKEN the MCP server uses.

    Never declare or open a LOCAL backend here. The workspace must already exist — if
    it doesn't, tell the user to apply `../setup` first rather than creating it by hand.

    Treat Scalr policy as a gate, not a report: before asking the user to approve
    a plan, ask Scalr which policy group governs the workspace's environment,
    evaluate the exported plan against its rego with OPA, and include the result
    in the approval summary. If a hard-mandatory policy denies, say so and
    propose a remedy instead of asking for approval.

    Ask ONCE. When a hard-mandatory policy denies, state the violation, name the
    minimal compliant remedy, and ask a single question: whether to apply that
    remedy and re-plan. Do not follow an answered question with another that
    re-confirms the same decision — re-plan, re-evaluate the policies, and bring
    the corrected plan back for the normal approval. So a blocked request costs
    the user exactly two decisions: accept the remedy, then approve the plan.

# External MCP servers the turf agent connects to alongside its built-in
# turf-mcp-server. This is what lets a LOCAL turf session compose Scalr's
# otherwise remote-only features: read the Scalr API (variables, policy, modules)
# and evaluate policy with OPA — all inside the agent loop. See the `scalr` skill
# in .turf/skills/scalr for the playbooks that use these.
#
# cagent prefixes each server's tools with its name, so these appear as `scalr_*`
# and `opa_*`, distinct from turf's own `turf_*`.
#
# Export these before launching turf (the `docker run --env NAME` form forwards
# them from your shell into the container — no secret is written to this file):
#   export SCALR_API_TOKEN="$SCALR_TOKEN"
#   export SCALR_API_URL="https://<your-account>.scalr.io"
mcps:
  scalr:
    command: docker
    args: [run, --rm, -i, --env, SCALR_API_TOKEN, --env, SCALR_API_URL, scalr/mcp-server:latest]
  opa:
    command: docker
    args: [run, --rm, -i, orygn/opa-mcp:latest]
    # No Docker? Swap the two lines above for the keyless npm runner:
    #   command: npx
    #   args: [-y, "@orygn/opa-mcp"]
