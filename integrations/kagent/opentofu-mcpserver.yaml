apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: opentofu-registry
  namespace: kagent
spec:
  # OpenTofu retired the SSE endpoint (/sse answers 410 Gone); /mcp is the
  # streamable HTTP transport.
  url: "https://mcp.opentofu.org/mcp"
  protocol: STREAMABLE_HTTP
  timeout: 30s
  sseReadTimeout: 5m0s
  description: "OpenTofu Registry MCP server for searching providers, modules, and resource documentation"
