# turf-mcp-server reads and writes the Kubernetes state backend (Secrets and
# Leases), and turf-engine runs the provider plugins, so a kubernetes or helm
# provider configured in-cluster authenticates as the engine's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: turf-mcp-server-admin
subjects:
  - kind: ServiceAccount
    name: turf-mcp-server
    namespace: kagent
  - kind: ServiceAccount
    name: turf-engine
    namespace: kagent
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
