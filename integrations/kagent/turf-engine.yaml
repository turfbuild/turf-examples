# turf-engine: Turf's planning and execution, served to restate-server
# (restate.yaml) and registered with it at startup. It runs from the server's
# image with its own command, and it is where provider plugins run, so the
# providers' credentials go here (the kagent-azure Secret's ARM_* variables).
#
# It listens on every interface, as a pod must, and serves only requests
# restate-server signs: TURF_ENGINE_IDENTITY_KEYS is the public half of the key
# in the turf-engine-identity Secret (README). networkpolicy.yaml admits only
# restate-server besides.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: turf-engine
  namespace: kagent
---
apiVersion: v1
kind: Service
metadata:
  name: turf-engine
  namespace: kagent
spec:
  selector:
    app: turf-engine
  ports:
    - name: restate
      port: 9080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turf-engine
  namespace: kagent
spec:
  # One engine per restate-server: restate routes every new invocation to the
  # deployment registered last. More than one replica would also need the data
  # directory below on a volume they share.
  replicas: 1
  selector:
    matchLabels:
      app: turf-engine
  template:
    metadata:
      labels:
        app: turf-engine
    spec:
      serviceAccountName: turf-engine
      containers:
        - name: turf-engine
          # The same image as turf-mcpserver.yaml: keep the two tags equal.
          image: ghcr.io/turfbuild/turf-mcp-server:v1.0.1
          command: ["/turf-engine"]
          args:
            - --addr=0.0.0.0:9080
            - --advertise=http://turf-engine.kagent.svc:9080
            - --admin-addr=http://restate.kagent.svc:9070
            - --plugin-cache-dir=/turf/plugins
            # The engine's own data directory: each workspace's modules install
            # under /turf/data/<lineage>/modules. Nothing is written into the
            # configuration, and nothing is sent by the server.
            - --data-dir=/turf/data
          env:
            - name: TURF_ENGINE_IDENTITY_KEYS
              valueFrom:
                secretKeyRef:
                  name: turf-engine-identity
                  key: public-key
            # Where providers come from: the OpenTofu CLI configuration in
            # turf-cli-config.yaml, the file the server reads too.
            - name: TF_CLI_CONFIG_FILE
              value: /turf/cli/turf.tfrc
          envFrom:
            - secretRef:
                name: kagent-azure
                optional: true
          ports:
            - name: restate
              containerPort: 9080
          # The configuration image at the path the server names
          # (turf-mcpserver.yaml), read-only: the same path in both pods, so no
          # --workdir mapping is needed. The data directory is an emptyDir, a
          # cache: a restart empties it, and the approval gate installs the
          # modules again. The plugin cache is the pod's own as well: each
          # replica installs from where turf.tfrc says, never into a cache it
          # shares with another.
          volumeMounts:
            - name: configuration
              mountPath: /turf/config
              readOnly: true
            - name: data
              mountPath: /turf/data
            - name: plugins
              mountPath: /turf/plugins
            - name: cli-config
              mountPath: /turf/cli
              readOnly: true
      volumes:
        - name: configuration
          image:
            reference: ghcr.io/turfbuild/turf-examples/kubernetes-in-cluster:1.0.0
            pullPolicy: IfNotPresent
        - name: data
          emptyDir: {}
        - name: plugins
          emptyDir: {}
        - name: cli-config
          configMap:
            name: turf-cli-config
